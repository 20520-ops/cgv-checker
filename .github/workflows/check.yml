name: CGV Ticket Auto Checker

on:
  workflow_dispatch: # 수동으로 테스트할 수 있게 남겨둡니다.
  schedule:
    - cron: '*/10 * * * *' # 10분마다 자동으로 실행 (시간은 UTC 기준)

jobs:
  check-ticket:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 

      - name: Run Crawler
        env:
          GMAIL_ID: ${{ secrets.GMAIL_ID }}
          GMAIL_APP_PW: ${{ secrets.GMAIL_APP_PW }}
        run: python crawler.py
